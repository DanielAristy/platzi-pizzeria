spring.application.name=platzi-pizzeria
spring.datasource.url=jdbc:mysql://localhost:3306/pizzeria?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=admin
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Crear las tablas a partir de las entidades
spring.jpa.hibernate.ddl-auto=update
# Mostrar las consultas SQL en la consola
spring.jpa.show-sql=true

# Desactivar logs específicos de Hibernate
logging.level.org.hibernate.orm.connections.pooling=OFF
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=OFF

#Security Log
logging.level.org.springframework.security.web.*=debug